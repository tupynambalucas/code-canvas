name: Deploy Documentation

on:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yaml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup PNPM Environment
        uses: ./.github/actions/setup-pnpm-env
        with:
          node-version: 22
          frozen-lockfile: 'false'

      - name: Generate Global Documents
        run: |
          pnpm docs:generate:changelog
          pnpm docs:generate:roadmap

      - name: Commit and Push Compiled Documents
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md ROADMAP.md
          if git diff --staged --quiet; then
            echo "No changes to CHANGELOG.md or ROADMAP.md"
          else
            git commit -m "docs: update root CHANGELOG.md and ROADMAP.md [skip ci]"
            git push
          fi

      - name: Build documentation
        run: pnpm docs:build
        env:
          DOCUSAURUS_BUCKET_URL: ${{ secrets.DOCUSAURUS_BUCKET_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
